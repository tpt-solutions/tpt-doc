[package]
name = "tpt-doc-sign"
description = "Pure-Rust cryptographic document signing — PAdES, XAdES, CAdES — leveraging ring primitives"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pades", "xades", "cades", "cms", "digital-signature"]
categories = ["cryptography", "encoding", "security"]
readme = "README.md"
documentation = "https://docs.rs/tpt-doc-sign"
rust-version.workspace = true

[dependencies]
tpt-doc-core = { workspace = true }
tpt-doc-pdf   = { workspace = true }
ring = { workspace = true }
x509-parser = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Used only to keep the workspace README quick-start compiling as a test.
tpt-doc-fhir = { workspace = true }
