[package]
name = "tpt-doc-ubl"
description = "UBL 2.1/2.3 and PEPPOL BIS Billing 3.0 e-invoicing — parse and generate compliant XML invoices"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ubl", "peppol", "invoice", "e-invoicing", "factur-x"]
categories = ["encoding", "parser-implementations", "finance", "date-and-time"]
readme = "README.md"
documentation = "https://docs.rs/tpt-doc-ubl"
rust-version.workspace = true

[dependencies]
tpt-doc-core = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tpt-doc-pdf = { workspace = true, optional = true }

[features]
default = []
# Factur-X/ZUGFeRD hybrid: attach the UBL invoice XML to a PDF document
# (electronic invoice embedding per PDF 2.0 associated files).
facturx = ["dep:tpt-doc-pdf"]

[dev-dependencies]
proptest = { workspace = true }
