[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Scope of dependency graph scanned for unmaintained advisories
# (cargo-deny >= 0.18 schema; unmaintained/vulnerable advisories deny by default).
unmaintained = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
# Any license not in the allow list is denied (cargo-deny >= 0.18 schema).
confidence-threshold = 0.8

# ring uses ISC + BoringSSL portions; the ring crate itself is ISC-licensed
[[licenses.exceptions]]
allow = ["ISC"]
name = "ring"
version = "*"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
